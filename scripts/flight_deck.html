<!doctype html>
<html><head><meta charset="utf-8"><title>APEX Flight Deck</title>
<style>
:root{--bg:#0b0e13;--panel:#141922;--line:#1f2833;--txt:#d7dee8;
--dim:#7c8899;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--seal:#a78bfa;
--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
header{display:flex;justify-content:space-between;align-items:center;
padding:10px 16px;background:#0e131b;border-bottom:1px solid var(--line)}
h1{font-size:14px;margin:0;letter-spacing:.14em}
.seal{color:var(--seal);font-weight:700;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px;padding:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
padding:10px 12px;overflow:hidden}
.panel h2{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:0 0 8px;
text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;
border-bottom:1px dotted #1b2330}
.row:last-child{border-bottom:0}
.k{color:var(--dim)} .v{text-align:right;word-break:break-word}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.una{color:#5b6675;font-style:italic}
canvas{width:100%;height:300px;display:block;background:#0d1218;
border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);text-align:left;font-weight:400;padding:3px 4px;
border-bottom:1px solid var(--line)}
td{padding:3px 4px;border-bottom:1px dotted #1b2330}
.full{grid-column:1/-1}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;
border:1px solid currentColor}
.small{font-size:11px;color:var(--dim)}
</style></head><body>
<header>
  <h1>APEX FLIGHT DECK</h1>
  <div><span class="small" id="clock">—</span>
  &nbsp;&nbsp;<span class="seal">LIVE CAPITAL: SEALED</span>
  &nbsp;&nbsp;<span id="kill" class="pill ok">KILL SWITCH: ARMED</span></div>
</header>
<div class="grid">
  <div class="panel"><h2>BTC-USD · live (APEX bars)</h2>
    <canvas id="chart"></canvas>
    <div class="small" id="chartmeta">—</div></div>
  <div class="panel"><h2>Captain</h2><div id="captain"></div></div>
  <div class="panel"><h2>Digital World</h2><div id="world"></div></div>

  <div class="panel"><h2>Oracle</h2><div id="oracle"></div></div>
  <div class="panel"><h2>Assassin</h2><div id="assassin"></div></div>
  <div class="panel"><h2>Capital</h2><div id="capital"></div></div>

  <div class="panel"><h2>Execution</h2><div id="exec"></div></div>
  <div class="panel"><h2>Shadow positions</h2><div id="shadow"></div></div>
  <div class="panel"><h2>Equity Epoch 1</h2><div id="equity"></div></div>

  <div class="panel full"><h2>Opportunity Board</h2>
    <div id="board"></div></div>
  <div class="panel full"><h2>Execution Readiness</h2>
    <div id="readiness" style="columns:3;column-gap:24px"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cls=v=>{const s=String(v||"").toUpperCase();
 if(/SEALED/.test(s))return"seal";
 if(/READY|OK|ARMED|CLEAN|TRADABLE|LIVE|PASS|HEALTHY/.test(s))return"ok";
 if(/PARTIAL|WATCH|WARN|MODERATE|WOUNDED|DEGRADED|STALE|OBSERVE/.test(s))
   return"warn";
 if(/BLOCK|REFUS|FAIL|KILL|NO_TRADE|UNAVAIL|NOT_LOADED|EMPTY|UNKNOWN|NONE/
   .test(s))return"bad";
 return""};
function rows(el,pairs){el.innerHTML=pairs.map(([k,v])=>{
  const t=(v===null||v===undefined||v==="")?"UNAVAILABLE":v;
  const c=(v===null||v===undefined||v==="")?"una":cls(t);
  return `<div class="row"><span class="k">${k}</span>
          <span class="v ${c}">${t}</span></div>`}).join("")}
function fmt(x,d=4){return (x===null||x===undefined)?null:
  (typeof x==="number"?x.toFixed(d):x)}

function drawChart(bars){
  const c=$("chart"),dpr=devicePixelRatio||1;
  c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
  const g=c.getContext("2d");g.scale(dpr,dpr);
  const W=c.clientWidth,H=c.clientHeight;
  g.clearRect(0,0,W,H);
  if(!bars||!bars.length){g.fillStyle="#5b6675";g.font="12px monospace";
    g.fillText("NO BARS — feed unavailable",12,24);return}
  const lo=Math.min(...bars.map(b=>b.l)),hi=Math.max(...bars.map(b=>b.h));
  const pad=(hi-lo)*0.08||1,y0=lo-pad,y1=hi+pad;
  const X=i=>10+i*((W-20)/bars.length),Y=p=>H-20-((p-y0)/(y1-y0))*(H-34);
  g.strokeStyle="#1f2833";g.beginPath();
  for(let i=0;i<=4;i++){const y=20+i*((H-40)/4);g.moveTo(8,y);g.lineTo(W-8,y)}
  g.stroke();
  const w=Math.max(1.4,(W-20)/bars.length*0.62);
  bars.forEach((b,i)=>{const up=b.c>=b.o;
    g.strokeStyle=g.fillStyle=up?"#4ade80":"#f87171";
    g.beginPath();g.moveTo(X(i),Y(b.h));g.lineTo(X(i),Y(b.l));g.stroke();
    const yo=Y(b.o),yc=Y(b.c);
    g.fillRect(X(i)-w/2,Math.min(yo,yc),w,Math.max(1,Math.abs(yc-yo)))});
  // VWAP over window
  let pv=0,vv=0;const vw=bars.map(b=>{pv+=(b.h+b.l+b.c)/3*b.v;vv+=b.v;
    return vv?pv/vv:b.c});
  g.strokeStyle="#38bdf8";g.setLineDash([4,3]);g.beginPath();
  vw.forEach((p,i)=>i?g.lineTo(X(i),Y(p)):g.moveTo(X(i),Y(p)));g.stroke();
  g.setLineDash([]);
  g.fillStyle="#7c8899";g.font="10px monospace";
  g.fillText(hi.toFixed(2),W-70,26);g.fillText(lo.toFixed(2),W-70,H-24);
}

async function tick(){
  let s;try{s=await (await fetch("/api/state")).json()}catch(e){return}
  $("clock").textContent=s.t;
  const ks=s.execution.kill_switch;
  $("kill").textContent="KILL SWITCH: "+(ks.engaged?"ENGAGED":"ARMED");
  $("kill").className="pill "+(ks.engaged?"bad":"ok");

  const c=s.crypto,w=c.world||{};
  drawChart(c.bars);
  $("chartmeta").textContent=
    `${(c.bars||[]).length} bars · decisions ${c.counts.crypto_decision||0}`
    +` · worlds ${c.counts.crypto_world||0} · exits `
    +`${c.counts.crypto_shadow_exit||0}`;

  const cap=c.captain||s.equity.captain||{};
  rows($("captain"),[
    ["directive",cap.next_action],["quality",cap.opportunity_quality],
    ["directional",cap.directional_thesis],["entry",cap.entry_thesis],
    ["unresolved",cap.primary_unresolved],
    ["intel spend",cap.recommended_intelligence_spend],
    ["persistence",cap.alpha_persistence],
    ["do not",(cap.do_not||[]).join("; ")],
    ["re-evaluate",(cap.re_evaluate_when||[]).join("; ")],
    ["authority","CAPITAL IS SOVEREIGN"]]);

  const fab=(w.fabric||{});
  rows($("world"),[
    ["BTC 60m",fmt((w.returns_60m||{})["BTC-USD"],5)],
    ["ETH 60m",fmt((w.returns_60m||{})["ETH-USD"],5)],
    ["SOL 60m",fmt((w.returns_60m||{})["SOL-USD"],5)],
    ["BTC-ETH RS",fmt(w.btc_eth_rs_60m,5)],
    ["breadth",fmt(w.breadth_positive_frac,2)],
    ["vol state",fmt(w.btc_vol_state,4)],
    ["uncertain",String(w.uncertain)],
    ["book health",fab.book_health],
    ["gaps",fab.gaps_detected],["reconnects",fab.reconnects],
    ["known_from",w.t_utc]]);

  const b=s.equity.bundle||{};
  rows($("oracle"),[
    ["analog",(b.analog_view||{}).status],
    ["analog n_eff",(b.analog_view||{}).n_effective],
    ["ml",(b.ml_view||{}).status],
    ["distribution",b.distribution_source_status],
    ["simulator",(b.simulation_view||{}).status||"UNCALIBRATED_OR_ABSENT"],
    ["disagreement",(b.disagreement||{}).level],
    ["note","views kept separate — never averaged"]]);

  const a=c.assassin||s.equity.assassin||{};
  const sv=a.swarm_view||{};
  rows($("assassin"),[
    ["verdict",a.verdict],["swarm",sv.status],
    ["adversary",sv.adversary_verdict],
    ["flags",(sv.flags||a.landed||[]).slice(0,4).join("; ")],
    ["world uncertain",String(a.world_uncertain)]]);

  const k=s.equity.capital||{};
  rows($("capital"),[
    ["state",k.final_state],
    ["reasons",(k.reason_codes||[]).join(", ")],
    ["forecast",k.forecast_status],
    ["sizing",k.weight?("weight "+fmt(k.weight,4)):"NOT AUTHORIZED"],
    ["paper eligible","UNREACHABLE (Phase 3 gate)"]]);

  const ex=s.execution;
  rows($("exec"),[
    ["broker",ex.broker.status],
    ["placement surface",ex.broker.placement_surface],
    ["package scan",ex.placement_scan.clean?"NO PLACEMENT CODE":"OFFENDERS"],
    ["order-ready intents",ex.order_ready_count],
    ["kill switch",ex.kill_switch.kill_switch],
    ["LIVE PLACEMENT",ex.live_placement],
    ["operator step",ex.broker.operator_step||"—"]]);

  const pos=c.open_shadow_positions||[];
  $("shadow").innerHTML=pos.length?`<table><tr><th>id</th><th>side</th>
    <th>entry</th><th>stop</th><th>target</th></tr>`+pos.map(p=>
    `<tr><td>${p.decision_id.slice(0,8)}</td><td>${p.direction}</td>
     <td>${fmt(p.shadow_entry_price,2)}</td><td>${fmt(p.stop,2)}</td>
     <td>${fmt(p.target,2)}</td></tr>`).join("")+"</table>"
    :`<div class="una">no open shadow positions</div>`;

  const eq=s.equity;
  rows($("equity"),[
    ["ledger",eq.ledger_exists?"LIVE":"EMPTY UNTIL MONDAY"],
    ["state records",eq.counts.forward_state],
    ["scans",eq.counts.scan],["decisions",eq.counts.decision],
    ["capital records",eq.counts.capital_decision],
    ["realizations",eq.counts.realization]]);

  const bd=(eq.board||{}).entries||[];
  $("board").innerHTML=bd.length?`<table><tr><th>#</th><th>symbol</th>
    <th>quality</th><th>direction</th><th>entry</th><th>unresolved</th>
    <th>captain</th><th>capital</th><th>why</th></tr>`+bd.map(e=>
    `<tr><td>${e.rank}</td><td>${e.symbol}</td>
     <td class="${cls(e.quality)}">${e.quality}</td>
     <td>${e.directional_thesis}</td><td>${e.entry_thesis}</td>
     <td>${e.primary_unresolved}</td><td>${e.next_action}</td>
     <td class="${cls(e.capital_state)}">${e.capital_state||"—"}</td>
     <td class="small">${e.why_ranked_here}</td></tr>`).join("")+"</table>"
    :`<div class="una">no live candidates — the board is empty
      (a legal and common state)</div>`;

  $("readiness").innerHTML=Object.entries(s.readiness).map(([k,v])=>
    `<div class="row"><span class="k">${k}</span>
     <span class="v ${cls(v)}">${v}</span></div>`).join("");
}
tick();setInterval(tick,5000);
</script></body></html>
