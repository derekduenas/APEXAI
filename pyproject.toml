[project]
name = "apex-equities"
version = "0.1.0"
description = "APEX Research Protocol v1.0 -- Experiment #001 execution engine"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "scipy", "statsmodels", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full 40-seed calibration sweep; run before every merge"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apex*"]
